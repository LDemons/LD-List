<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LD-List</title>
    <meta name="description" content="Registro personal de películas, series, juegos, anime y música" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Aplica el tema guardado antes del primer pintado (ver src/lib/tema.tsx).
      try {
        var t = localStorage.getItem('ld-tema')
        var oscuro = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', oscuro)
        document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
